[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openframetap"
version = "0.1.0"
description = "Read-only ROCK 4D prototype tooling for OpenFrameTap"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "bleak>=0.22,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
analysis = [
  "numpy>=2,<3",
  "opencv-python>=4.10,<5",
  "Pillow>=11,<13",
]

[project.scripts]
openframetap = "openframetap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
